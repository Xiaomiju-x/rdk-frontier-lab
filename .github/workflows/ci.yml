name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test and build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Generated metadata is synchronized
        run: |
          python tools/render_catalogue.py --check
          python tools/build_metadata.py --check
      - name: Public tree, exact index blobs, data schemas and local links
        run: |
          python tools/check_publication.py
          python tools/check_publication.py --git-index
      - name: Build and inspect distributions
        run: |
          python -m build --no-isolation
          python tools/check_distribution.py
          python -m pip check
      - name: Install the wheel outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rdk-wheel-smoke"
          "$RUNNER_TEMP/rdk-wheel-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rdk-wheel-smoke/bin/rdk-lab" --version
          "$RUNNER_TEMP/rdk-wheel-smoke/bin/rdk-lab" doctor
          "$RUNNER_TEMP/rdk-wheel-smoke/bin/rdk-lab" demo
          "$RUNNER_TEMP/rdk-wheel-smoke/bin/rdk-lab" catalog --target s600 --json
      - name: Retain reviewed build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: windows-latest, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install the editable package
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Offline regression tests with branch coverage
        run: python -m coverage run -m unittest discover -v
      - name: Enforce minimum coverage
        run: python -m coverage report --fail-under=90
      - name: Export coverage data
        run: python -m coverage xml
      - name: Run public geometry example
        run: python examples/geometry_demo.py
      - name: Retain measured coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Release gate
    needs: [quality, test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every quality and test job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success
